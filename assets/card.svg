<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="360" viewBox="0 0 840 360" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"><style>.shine{animation:sw 4s ease-in-out infinite}@keyframes sw{0%{transform:translateX(0)}60%,100%{transform:translateX(1300px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F5FF"/><stop offset="1" stop-color="#9D5CFF"/></linearGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".06"/></pattern>
<clipPath id="pc"><rect x="5" y="5" width="240" height="290" rx="12"/></clipPath><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="840" height="360" rx="18" fill="#05051A"/><rect width="840" height="360" rx="18" fill="url(#dots)"/><rect x="1" y="1" width="838" height="358" rx="17" fill="none" stroke="url(#g)" stroke-opacity=".55" stroke-width="2"/>
<g transform="translate(40,30)">
  <rect width="250" height="300" rx="16" fill="url(#g)"/>
  <image href="data:image/jpeg;base64," x="5" y="5" width="240" height="290" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc)"/>
</g>
<text x="330" y="70" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="3" fill="#9D5CFF">PLAYER CARD · #001</text>
<text x="330" y="108" font-size="32" font-weight="700" fill="#EEF2FF">Shubham Shaw</text>
<text x="330" y="136" font-size="16" fill="#00F5FF">Senior Software Engineer · Bengaluru</text>
<text x="330" y="176" font-size="15" fill="#EEF2FF"><tspan fill="#00F5FF">◆ </tspan>Commerce graduate turned</text><text x="348" y="196" font-size="15" fill="#9AA3C7">software engineer</text><text x="330" y="224" font-size="15" fill="#EEF2FF"><tspan fill="#00F5FF">◆ </tspan>Shipped an Android app solo,</text><text x="348" y="244" font-size="15" fill="#9AA3C7">live in 5 countries</text><text x="330" y="272" font-size="15" fill="#EEF2FF"><tspan fill="#00F5FF">◆ </tspan>Pat on Back Award</text><text x="348" y="292" font-size="15" fill="#9AA3C7">at DIATOZ Digital</text>
<g transform="skewX(-18)"><rect class="shine" x="-300" y="0" width="160" height="360" fill="url(#sh)"/></g>
</svg>