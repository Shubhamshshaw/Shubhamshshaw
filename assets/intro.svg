<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="290" viewBox="0 0 840 290" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" class="anim"><style>
.l{opacity:1;animation:none}.anim .l{opacity:0;animation:in .4s ease forwards}
@keyframes in{to{opacity:1}}
.r{opacity:0;animation:rot 8s infinite}
.r:first-child{opacity:1}
@keyframes rot{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
.spin{transform-origin:0 0;animation:sp 24s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F5FF"/><stop offset="1" stop-color="#9D5CFF"/></linearGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".06"/></pattern>
<clipPath id="cc"><circle r="96"/></clipPath></defs><rect width="840" height="290" rx="18" fill="#05051A"/><rect width="840" height="290" rx="18" fill="url(#dots)"/><rect x="1" y="1" width="838" height="288" rx="17" fill="none" stroke="url(#g)" stroke-opacity=".55" stroke-width="2"/>
<text x="44" y="70" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#00F5FF" opacity=".8">HELLO, WORLD — I'M</text>
<text x="44" y="122" font-size="48" font-weight="700" fill="#EEF2FF"><tspan class="l" style="animation-delay:0.00s">S</tspan><tspan class="l" style="animation-delay:0.08s">h</tspan><tspan class="l" style="animation-delay:0.16s">u</tspan><tspan class="l" style="animation-delay:0.24s">b</tspan><tspan class="l" style="animation-delay:0.32s">h</tspan><tspan class="l" style="animation-delay:0.40s">a</tspan><tspan class="l" style="animation-delay:0.48s">m</tspan><tspan class="l" style="animation-delay:0.56s">&#160;</tspan><tspan class="l" style="animation-delay:0.64s">S</tspan><tspan class="l" style="animation-delay:0.72s">h</tspan><tspan class="l" style="animation-delay:0.80s">a</tspan><tspan class="l" style="animation-delay:0.88s">w</tspan></text>
<rect x="44" y="140" width="4" height="36" fill="url(#g)"/>
<g font-size="22" font-weight="600" fill="url(#g)" transform="translate(14,0)"><text class="r" x="44" y="168" style="animation-delay:0s">Senior Software Engineer</text><text class="r" x="44" y="168" style="animation-delay:2s">Backend &amp; Microservices</text><text class="r" x="44" y="168" style="animation-delay:4s">.NET · Java · Angular</text><text class="r" x="44" y="168" style="animation-delay:6s">Indie Android app maker</text></g>
<text x="44" y="222" font-size="16" fill="#9AA3C7">Building scalable backends by day,</text>
<text x="44" y="246" font-size="16" fill="#9AA3C7">shipping <tspan fill="#EEF2FF" font-weight="600">Vatsalya Circle</tspan> on the side.</text>
<g transform="translate(610,145)">
  <circle r="112" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="6 10" class="spin"/>
  <circle r="100" fill="#0B0B28"/>
  <image href="data:image/jpeg;base64," x="-96" y="-96" width="192" height="192" clip-path="url(#cc)"/>
